<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive World Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="models/class.js" defer></script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/map.css">
</head>

<body>
<header>
    <nav>
      <a href="index.html">Home</a>
      <a href="international.html">International</a>
    </nav>
</header>

<div id="wrap">
  <h1>World <span>Atlas</span></h1>
  <div id="msgbox"><span class="label">Selected</span><span id="msgtext">—</span></div>
  <svg id="map"></svg>
  <div id="controls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">–</button>
    <button id="reset">⟳</button>
  </div>
</div>

<label for="mySelect"></label>

<select id="mySelect" name="mySelect">
  <option value="option1">None</option>
  <option value="option2">Monthly petroleum and other liquids production</option>
  <option value="option3">Annual refined petroleum products production</option>
  <option value="option4">Annual refined petroleum products consumption</option>
  <option value="option5">Annual refined petroleum products production and consumption</option>
  <option value="option6">Dry natural gas production</option>
  <option value="option7">Dry natural gas consumption</option>
  <option value="option8">Dry natural gas production and consumption</option>
  <option value="option9">Coal production</option>
  <option value="option10">Coal consumption</option>
  <option value="option11">Coal production and consumption</option>
  <option value="option12">Electricity generation</option>
  <option value="option13">Electricity consumption</option>
  <option value="option14">Electricity generation and consumption</option>
</select>

<div id=container></div>
<div id="container2"></div>
<canvas id="container3"></canvas>


<script type="module" src="international.js" defer></script>
</body>

</html>
