<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive World Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
  :root{
    --ocean: #0b1d2e;
    --ocean-deep: #081522;
    --land: #1f3b4d;
    --land-hover: #2f6f8f;
    --land-selected: #d97757;
    --border: #0b1d2e;
    --ink: #eaf2f5;
    --muted: #7fa3b3;
    --accent: #4fd1c5;
  }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, var(--ocean) 0%, var(--ocean-deep) 100%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--ink);
    overflow:hidden;
  }
  #wrap{ position:relative; width:100vw; height:100vh; }
  h1{
    position:absolute; top:18px; left:24px; margin:0;
    font-size:1.3rem; font-weight:400; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted);
    z-index:5;
  }
  h1 span{ color:var(--accent); }
  svg{ width:100%; height:100%; display:block; cursor:grab; }
  svg:active{ cursor:grabbing; }
  path.country{
    fill: var(--land);
    stroke: var(--border);
    stroke-width: 0.5;
    transition: fill 0.15s ease;
    cursor:pointer;
  }
  path.country:hover{ fill: var(--land-hover); }
  path.country.selected{ fill: var(--land-selected); }

  #controls{
    position:absolute; bottom:24px; right:24px; z-index:5;
    display:flex; flex-direction:column; gap:8px;
  }
  #controls button{
    width:38px; height:38px;
    background: rgba(234,242,245,0.08);
    border:1px solid rgba(234,242,245,0.25);
    color: var(--ink);
    font-size:1.1rem;
    border-radius:6px;
    cursor:pointer;
    backdrop-filter: blur(4px);
  }
  #controls button:hover{ background: rgba(79,209,197,0.25); border-color: var(--accent); }

  #msgbox{
    position:absolute; top:24px; right:24px; z-index:6;
    min-width:220px;
    padding:14px 18px;
    background: rgba(15,30,42,0.92);
    border:1px solid var(--accent);
    border-radius:8px;
    font-size:1rem;
    letter-spacing:0.02em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity:0; transform: translateY(-8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
  }
  #msgbox.show{ opacity:1; transform: translateY(0); }
  #msgbox .label{
    display:block; font-size:0.7rem; letter-spacing:0.15em;
    text-transform:uppercase; color:var(--muted); margin-bottom:4px;
  }
</style>
</head>
<body>
<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="page1.html">Page1</a>
    </nav>
</header>
<div id="wrap">
  <h1>World <span>Atlas</span></h1>
  <div id="msgbox"><span class="label">Selected</span><span id="msgtext">—</span></div>
  <svg id="map"></svg>
  <div id="controls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">–</button>
    <button id="reset">⟳</button>
  </div>
</div>

<script>
const svg = d3.select("#map");
const width = window.innerWidth, height = window.innerHeight;
const g = svg.append("g");

const projection = d3.geoNaturalEarth1()
  .scale(width / 5.8)
  .translate([width / 2, height / 2]);

const path = d3.geoPath().projection(projection);

const zoom = d3.zoom()
  .scaleExtent([1, 12])
  .on("zoom", (event) => g.attr("transform", event.transform));

svg.call(zoom);

const msgbox = document.getElementById("msgbox");
const msgtext = document.getElementById("msgtext");
let hideTimer = null;

function showMessage(name){
  msgtext.textContent = name;
  msgbox.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => msgbox.classList.remove("show"), 3000);
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
  const countries = topojson.feature(world, world.objects.countries).features;

  g.selectAll("path.country")
    .data(countries)
    .join("path")
    .attr("class", "country")
    .attr("d", path)
    .on("click", function(event, d){
      g.selectAll("path.country").classed("selected", false);
      d3.select(this).classed("selected", true);
      const name = d.properties.name || "Unknown";
      showMessage(`${name} selected`);
    });
});

document.getElementById("zoomIn").onclick = () => svg.transition().call(zoom.scaleBy, 1.5);
document.getElementById("zoomOut").onclick = () => svg.transition().call(zoom.scaleBy, 1/1.5);
document.getElementById("reset").onclick = () => svg.transition().call(zoom.transform, d3.zoomIdentity);
</script>
</body>

</html>
